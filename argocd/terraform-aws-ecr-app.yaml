apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: terraform-aws-ecr
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=672296383659.dkr.ecr.ap-south-1.amazonaws.com/terraform-aws-ecr
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^[a-f0-9]{40}$
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: terraform-aws-project
  source:
    repoURL: https://github.com/mfasi7863/app-config.git
    targetRevision: main
    path: apps/terraform-aws-ecr
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: terraform-aws-ecr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
