apiVersion: apps/v1
kind: Deployment
metadata:
  name: terraform-aws-ecr
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: terraform-aws-ecr
  template:
    metadata:
      labels:
        app: terraform-aws-ecr
    spec:
      serviceAccountName: terraform-aws-ecr
      containers:
        - name: terraform-aws-ecr
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80